[project]
name = "agent-lab"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Masaaki Koura on ubuntu-masa", email = "koura718@gmail.com" }
]
requires-python = ">=3.14"
